<!DOCTYPE html>
<html lang="nn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Halloween – Lær norske ord!</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            font-family: 'Nunito', Arial, sans-serif;
            background: linear-gradient(135deg, #FF9418 0%, #FFB52E 100%);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .screen {
            display: none;
            min-height: 100vh;
            padding: 20px;
            animation: fadeIn 0.5s ease;
        }

        .screen.active {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Background decorations */
        .bg-decoration {
            position: fixed;
            pointer-events: none;
            z-index: 0;
        }

        .spider-web {
            top: 0;
            right: 0;
            width: 150px;
            height: 150px;
            opacity: 0.3;
            animation: swing 3s ease-in-out infinite;
        }

        .bat {
            animation: fly 8s ease-in-out infinite;
        }

        .bat-1 { top: 10%; left: 10%; }
        .bat-2 { top: 20%; right: 15%; animation-delay: -4s; }

        @keyframes fly {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(30px, -20px) rotate(10deg); }
            50% { transform: translate(60px, 0) rotate(-5deg); }
            75% { transform: translate(30px, 20px) rotate(5deg); }
        }

        @keyframes swing {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        @keyframes confetti-fall {
            0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            pointer-events: none;
            z-index: 1000;
        }

        /* Start Screen */
        .title-container {
            text-align: center;
            margin-bottom: 30px;
            z-index: 1;
        }

        .main-title {
            font-size: 3rem;
            font-weight: 900;
            color: #111111;
            text-shadow: 3px 3px 0 #FFF8E8;
            margin-bottom: 10px;
            animation: float 3s ease-in-out infinite;
        }

        .subtitle {
            font-size: 1.5rem;
            font-weight: 700;
            color: #111111;
            background: #FFF8E8;
            padding: 10px 20px;
            border-radius: 20px;
            display: inline-block;
        }

        .character-display {
            display: flex;
            gap: 20px;
            margin: 30px 0;
            z-index: 1;
        }

        .character {
            font-size: 5rem;
            animation: float 3s ease-in-out infinite;
        }

        .character:nth-child(2) {
            animation-delay: -1.5s;
        }

        .name-input-container {
            background: #FFF8E8;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            z-index: 1;
            max-width: 400px;
            width: 100%;
        }

        .name-input-container h2 {
            font-size: 1.8rem;
            font-weight: 800;
            color: #111111;
            margin-bottom: 15px;
            text-align: center;
        }

        .name-input {
            width: 100%;
            padding: 15px;
            font-size: 1.2rem;
            font-family: 'Nunito', Arial, sans-serif;
            font-weight: 600;
            border: 3px solid #FF9418;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        .name-input:focus {
            border-color: #6B3FA0;
            transform: scale(1.05);
        }

        .welcome-message {
            font-size: 1.5rem;
            font-weight: 800;
            color: #6B3FA0;
            text-align: center;
            margin-bottom: 15px;
            display: none;
        }

        /* Buttons */
        .btn {
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: 800;
            font-family: 'Nunito', Arial, sans-serif;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            min-height: 48px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-primary {
            background: #111111;
            color: #FFF8E8;
        }

        .btn-primary:hover {
            background: #6B3FA0;
            transform: translateY(-3px);
        }

        .btn-secondary {
            background: #FFF8E8;
            color: #111111;
            border: 3px solid #FF9418;
        }

        .btn-secondary:hover {
            background: #FF9418;
            color: #FFF8E8;
        }

        .btn-large {
            padding: 20px 40px;
            font-size: 1.5rem;
        }

        /* Level Select */
        .level-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            max-width: 800px;
            width: 100%;
            z-index: 1;
        }

        .level-card {
            background: #FFF8E8;
            padding: 30px;
            border-radius: 25px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .level-card:hover {
            transform: translateY(-10px) scale(1.05);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .level-card h3 {
            font-size: 2rem;
            font-weight: 900;
            color: #111111;
            margin-bottom: 10px;
        }

        .level-card p {
            font-size: 1.1rem;
            font-weight: 700;
            color: #6B3FA0;
        }

        .level-icon {
            font-size: 4rem;
            margin-bottom: 15px;
        }

        /* Progress */
        .progress-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #FFF8E8;
            padding: 15px 30px;
            border-radius: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .progress-dots {
            display: flex;
            gap: 8px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #FFD85A;
            transition: all 0.3s ease;
        }

        .dot.active {
            background: #6B3FA0;
            transform: scale(1.3);
        }

        .dot.completed {
            background: #4CAF50;
        }

        .score-display {
            font-size: 1.5rem;
            font-weight: 900;
            color: #6B3FA0;
        }

        /* Word Card */
        .word-card {
            background: #FFF8E8;
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 500px;
            width: 100%;
            z-index: 1;
        }

        .word-emoji {
            font-size: 8rem;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        .word-norwegian {
            font-size: 3rem;
            font-weight: 900;
            color: #111111;
            margin-bottom: 10px;
        }

        .word-article {
            color: #6B3FA0;
            font-weight: 800;
        }

        .word-russian {
            font-size: 1.8rem;
            font-weight: 700;
            color: #FF9418;
            margin-bottom: 30px;
        }

        /* Letter Tiles */
        .letter-tiles {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            margin: 30px 0;
            min-height: 80px;
        }

        .letter-tile {
            width: 60px;
            height: 60px;
            background: #FF9418;
            color: #FFF8E8;
            font-size: 2rem;
            font-weight: 900;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            position: relative;
        }

        .letter-tile:hover {
            transform: translateY(-5px) scale(1.1);
        }

        .letter-tile:active {
            transform: scale(0.95);
        }

        .letter-tile.used {
            opacity: 0.3;
            pointer-events: none;
        }

        .answer-area {
            min-height: 80px;
            background: #FFD85A;
            border-radius: 20px;
            padding: 20px;
            margin: 20px 0;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            align-items: center;
        }

        .answer-letter {
            width: 60px;
            height: 60px;
            background: #6B3FA0;
            color: #FFF8E8;
            font-size: 2rem;
            font-weight: 900;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .answer-letter:hover {
            transform: scale(1.1);
        }

        /* Article Selection */
        .article-options {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .article-btn {
            padding: 15px 30px;
            font-size: 1.5rem;
            font-weight: 900;
            background: #FFF8E8;
            border: 3px solid #FF9418;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .article-btn:hover {
            background: #FF9418;
            color: #FFF8E8;
            transform: scale(1.1);
        }

        .article-btn.selected {
            background: #6B3FA0;
            color: #FFF8E8;
            border-color: #6B3FA0;
        }

        /* Choice Cards */
        .choice-cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            max-width: 500px;
            width: 100%;
            margin: 30px 0;
        }

        .choice-card {
            background: #FFF8E8;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        .choice-card:hover {
            transform: scale(1.05);
        }

        .choice-card:active {
            transform: scale(0.95);
        }

        .choice-card.correct {
            background: #4CAF50;
            animation: bounce 0.5s ease;
        }

        .choice-card.wrong {
            background: #f44336;
            animation: shake 0.5s ease;
        }

        .choice-emoji {
            font-size: 4rem;
            margin-bottom: 10px;
        }

        /* Feedback */
        .feedback {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #FFF8E8;
            padding: 30px 50px;
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
            font-size: 2rem;
            font-weight: 900;
            z-index: 1000;
            display: none;
            animation: bounce 0.5s ease;
        }

        .feedback.show {
            display: block;
        }

        /* Results */
        .results-container {
            background: #FFF8E8;
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 600px;
            width: 100%;
            z-index: 1;
        }

        .results-title {
            font-size: 2.5rem;
            font-weight: 900;
            color: #111111;
            margin-bottom: 20px;
        }

        .results-score {
            font-size: 3rem;
            font-weight: 900;
            color: #6B3FA0;
            margin: 20px 0;
        }

        .results-badge {
            font-size: 1.8rem;
            font-weight: 800;
            color: #FF9418;
            margin: 20px 0;
        }

        .learned-words {
            margin: 30px 0;
            text-align: left;
        }

        .learned-word {
            padding: 10px;
            margin: 10px 0;
            background: #FFD85A;
            border-radius: 10px;
            font-size: 1.2rem;
            font-weight: 700;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .main-title {
                font-size: 2rem;
            }

            .subtitle {
                font-size: 1.2rem;
            }

            .character {
                font-size: 3rem;
            }

            .word-emoji {
                font-size: 5rem;
            }

            .word-norwegian {
                font-size: 2rem;
            }

            .word-russian {
                font-size: 1.4rem;
            }

            .letter-tile, .answer-letter {
                width: 50px;
                height: 50px;
                font-size: 1.5rem;
            }

            .choice-cards {
                grid-template-columns: 1fr;
            }

            .progress-container {
                padding: 10px 20px;
                gap: 10px;
            }

            .score-display {
                font-size: 1.2rem;
            }
        }

        @media (max-width: 480px) {
            .main-title {
                font-size: 1.5rem;
            }

            .level-cards {
                grid-template-columns: 1fr;
            }

            .btn-large {
                padding: 15px 30px;
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <!-- Background Decorations -->
    <svg class="bg-decoration spider-web" viewBox="0 0 100 100">
        <path d="M100,0 L0,100 M100,20 L20,100 M100,40 L40,100 M80,0 L0,80 M60,0 L0,60" stroke="#111111" stroke-width="1" fill="none" opacity="0.3"/>
    </svg>
    <div class="bg-decoration bat bat-1">🦇</div>
    <div class="bg-decoration bat bat-2"></div>

    <!-- Start Screen -->
    <div id="start-screen" class="screen active">
        <div class="title-container">
            <h1 class="main-title">🎃 Halloween</h1>
            <div class="subtitle">Lær norske ord!</div>
        </div>

        <div class="character-display">
            <div class="character"></div>
            <div class="character">🐈‍⬛</div>
        </div>

        <div class="name-input-container">
            <h2>Kva heiter du?</h2>
            <input type="text" class="name-input" id="name-input" placeholder="Skriv namnet ditt">
            <div class="welcome-message" id="welcome-message"></div>
            <button class="btn btn-primary btn-large" id="start-btn" style="width: 100%;">START 🎃</button>
        </div>
    </div>

    <!-- Level Select Screen -->
    <div id="level-select-screen" class="screen">
        <div class="title-container">
            <h1 class="main-title">Velg nivå</h1>
        </div>

        <div class="level-cards">
            <div class="level-card" data-level="1">
                <div class="level-icon">🎃</div>
                <h3>NIVÅ 1</h3>
                <p>Lær orda</p>
            </div>
            <div class="level-card" data-level="2">
                <div class="level-icon">🕷️</div>
                <h3>NIVÅ 2</h3>
                <p>Bygg ordet</p>
            </div>
            <div class="level-card" data-level="3">
                <div class="level-icon">👻</div>
                <h3>NIVÅ 3</h3>
                <p>Høyr og finn</p>
            </div>
        </div>

        <button class="btn btn-primary btn-large" id="start-all-btn" style="margin-top: 30px;">
            🎃 Start frå begynnelsen
        </button>
    </div>

    <!-- Level 1 Screen -->
    <div id="level1-screen" class="screen">
        <div class="progress-container">
            <div class="progress-dots" id="level1-dots"></div>
            <div class="score-display">⭐ <span id="level1-score">0</span></div>
        </div>

        <div class="word-card" id="level1-card">
            <div class="word-emoji" id="level1-emoji">🎃</div>
            <div class="word-norwegian">
                <span class="word-article" id="level1-article">eit</span>
                <span id="level1-word">gresskar</span>
            </div>
            <div class="word-russian" id="level1-russian">тыква</div>
            <button class="btn btn-secondary" id="level1-speak-btn">
                🔊 Høyr ordet
            </button>
        </div>

        <button class="btn btn-primary btn-large" id="level1-next-btn" style="margin-top: 30px;">
            Neste →
        </button>
    </div>

    <!-- Level 2 Screen -->
    <div id="level2-screen" class="screen">
        <div class="progress-container">
            <div class="progress-dots" id="level2-dots"></div>
            <div class="score-display">⭐ <span id="level2-score">0</span></div>
        </div>

        <div class="word-card">
            <div class="word-emoji" id="level2-emoji">🎃</div>
            <div class="word-russian" id="level2-russian">тыква</div>

            <div id="level2-article-section">
                <p style="font-size: 1.2rem; font-weight: 700; margin-bottom: 10px;">Vel rett artikkel:</p>
                <div class="article-options" id="level2-articles">
                    <button class="article-btn" data-article="ein">ein</button>
                    <button class="article-btn" data-article="ei">ei</button>
                    <button class="article-btn" data-article="eit">eit</button>
                </div>
            </div>

            <div class="answer-area" id="level2-answer"></div>

            <div class="letter-tiles" id="level2-letters"></div>

            <div style="display: flex; gap: 15px; justify-content: center; flex-wrap: wrap;">
                <button class="btn btn-secondary" id="level2-hint-btn">
                    💡 Hint
                </button>
                <button class="btn btn-primary" id="level2-check-btn">
                    Sjekk ✓
                </button>
            </div>
        </div>
    </div>

    <!-- Level 3 Screen -->
    <div id="level3-screen" class="screen">
        <div class="progress-container">
            <div class="progress-dots" id="level3-dots"></div>
            <div class="score-display">⭐ <span id="level3-score">0</span></div>
        </div>

        <div class="word-card">
            <h2 style="font-size: 1.5rem; font-weight: 800; margin-bottom: 20px;">
                👻 NIVÅ 3 — HØYR OG FINN
            </h2>
            <p style="font-size: 1.2rem; font-weight: 700; margin-bottom: 30px;">
                Høyr godt og finn rett bilete!
            </p>

            <button class="btn btn-secondary btn-large" id="level3-speak-btn" style="margin-bottom: 30px;">
                🔊 Høyr ein gong til
            </button>

            <div class="choice-cards" id="level3-choices"></div>
        </div>
    </div>

    <!-- Results Screen -->
    <div id="results-screen" class="screen">
        <div class="results-container">
            <div class="results-title" id="results-title">🎃 GRATULERER!</div>
            <p style="font-size: 1.5rem; font-weight: 700; margin-bottom: 20px;">Du klarte det! 👻</p>
            <div class="results-score">⭐ <span id="results-score">0</span> / 30</div>
            <div class="results-badge" id="results-badge"></div>

            <div class="learned-words" id="learned-words"></div>

            <button class="btn btn-secondary" id="speak-all-btn" style="margin-bottom: 20px;">
                🔊 Høyr alle orda
            </button>

            <button class="btn btn-primary btn-large" id="restart-btn">
                🎃 Spel ein gong til
            </button>
        </div>
    </div>

    <!-- Feedback -->
    <div class="feedback" id="feedback"></div>

    <script>
        // Game Data
        const words = [
            { nn: "eit gresskar", word: "gresskar", article: "eit", ru: "тыква", emoji: "🎃" },
            { nn: "eit spøkelse", word: "spøkelse", article: "eit", ru: "привидение", emoji: "👻" },
            { nn: "ei heks", word: "heks", article: "ei", ru: "ведьма", emoji: "🧙‍♀️" },
            { nn: "ein vampyr", word: "vampyr", article: "ein", ru: "вампир", emoji: "" },
            { nn: "ein zombie", word: "zombie", article: "ein", ru: "зомби", emoji: "🧟" },
            { nn: "eit skjelett", word: "skjelett", article: "eit", ru: "скелет", emoji: "" },
            { nn: "ein edderkopp", word: "edderkopp", article: "ein", ru: "паук", emoji: "🕷️" },
            { nn: "ei flaggermus", word: "flaggermus", article: "ei", ru: "летучая мышь", emoji: "🦇" },
            { nn: "godteri", word: "godteri", article: "", ru: "сладости / конфеты", emoji: "🍬" },
            { nn: "eit kostyme", word: "kostyme", article: "eit", ru: "костюм", emoji: "🎭" }
        ];

        // Game State
        let playerName = '';
        let currentLevel = 0;
        let currentWordIndex = 0;
        let scores = { level1: 0, level2: 0, level3: 0 };
        let totalScore = 0;
        let level2Answer = [];
        let level2SelectedArticle = '';
        let level2HintUsed = false;

        // Audio Context
        let audioContext;

        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // Sound Effects
        function correctSound() {
            initAudio();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.setValueAtTime(523.25, audioContext.currentTime);
            oscillator.frequency.setValueAtTime(659.25, audioContext.currentTime + 0.1);
            oscillator.frequency.setValueAtTime(783.99, audioContext.currentTime + 0.2);
            
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.3);
        }

        function wrongSound() {
            initAudio();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.setValueAtTime(200, audioContext.currentTime);
            oscillator.frequency.setValueAtTime(150, audioContext.currentTime + 0.1);
            
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.2);
        }

        function victorySound() {
            initAudio();
            const notes = [523.25, 659.25, 783.99, 1046.50];
            notes.forEach((freq, index) => {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.setValueAtTime(freq, audioContext.currentTime + index * 0.15);
                
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime + index * 0.15);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + index * 0.15 + 0.3);
                
                oscillator.start(audioContext.currentTime + index * 0.15);
                oscillator.stop(audioContext.currentTime + index * 0.15 + 0.3);
            });
        }

        // Speech Synthesis
        function speak(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'nn-NO';
                utterance.rate = 0.8;
                
                const voices = speechSynthesis.getVoices();
                const nnVoice = voices.find(voice => voice.lang.includes('nn'));
                const nbVoice = voices.find(voice => voice.lang.includes('nb'));
                
                if (nnVoice) {
                    utterance.voice = nnVoice;
                } else if (nbVoice) {
                    utterance.voice = nbVoice;
                }
                
                speechSynthesis.speak(utterance);
            }
        }

        // Screen Management
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(screen => {
                screen.classList.remove('active');
            });
            document.getElementById(screenId).classList.add('active');
        }

        // Progress Dots
        function createProgressDots(containerId, total, current) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            for (let i = 0; i < total; i++) {
                const dot = document.createElement('div');
                dot.className = 'dot';
                if (i < current) dot.classList.add('completed');
                if (i === current) dot.classList.add('active');
                container.appendChild(dot);
            }
        }

        // Confetti
        function createConfetti() {
            const colors = ['#FF9418', '#FFD85A', '#6B3FA0', '#4CAF50', '#f44336'];
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animation = `confetti-fall ${Math.random() * 3 + 2}s linear`;
                confetti.style.animationDelay = Math.random() * 2 + 's';
                document.body.appendChild(confetti);
                
                setTimeout(() => confetti.remove(), 5000);
            }
        }

        // Feedback
        function showFeedback(message, duration = 1500) {
            const feedback = document.getElementById('feedback');
            feedback.textContent = message;
            feedback.classList.add('show');
            setTimeout(() => feedback.classList.remove('show'), duration);
        }

        // Start Screen
        document.getElementById('start-btn').addEventListener('click', () => {
            const nameInput = document.getElementById('name-input');
            playerName = nameInput.value.trim();
            
            if (playerName) {
                localStorage.setItem('playerName', playerName);
                showScreen('level-select-screen');
            } else {
                nameInput.style.borderColor = '#f44336';
                setTimeout(() => nameInput.style.borderColor = '#FF9418', 1000);
            }
        });

        document.getElementById('name-input').addEventListener('input', (e) => {
            const welcomeMessage = document.getElementById('welcome-message');
            if (e.target.value.trim()) {
                welcomeMessage.textContent = `Hei, ${e.target.value.trim()}! 👻`;
                welcomeMessage.style.display = 'block';
            } else {
                welcomeMessage.style.display = 'none';
            }
        });

        // Load saved name
        const savedName = localStorage.getItem('playerName');
        if (savedName) {
            document.getElementById('name-input').value = savedName;
            document.getElementById('welcome-message').textContent = `Velkomen tilbake, ${savedName}! 🎃`;
            document.getElementById('welcome-message').style.display = 'block';
        }

        // Level Select
        document.querySelectorAll('.level-card').forEach(card => {
            card.addEventListener('click', () => {
                const level = parseInt(card.dataset.level);
                startLevel(level);
            });
        });

        document.getElementById('start-all-btn').addEventListener('click', () => {
            startLevel(1);
        });

        function startLevel(level) {
            currentLevel = level;
            currentWordIndex = 0;
            
            if (level === 1) {
                showScreen('level1-screen');
                initLevel1();
            } else if (level === 2) {
                showScreen('level2-screen');
                initLevel2();
            } else if (level === 3) {
                showScreen('level3-screen');
                initLevel3();
            }
        }

        // Level 1
        function initLevel1() {
            createProgressDots('level1-dots', words.length, currentWordIndex);
            document.getElementById('level1-score').textContent = scores.level1;
            showWord1();
        }

        function showWord1() {
            const word = words[currentWordIndex];
            document.getElementById('level1-emoji').textContent = word.emoji;
            document.getElementById('level1-article').textContent = word.article;
            document.getElementById('level1-word').textContent = word.word;
            document.getElementById('level1-russian').textContent = word.ru;
            
            createProgressDots('level1-dots', words.length, currentWordIndex);
        }

        document.getElementById('level1-speak-btn').addEventListener('click', () => {
            const word = words[currentWordIndex];
            speak(word.nn);
            
            const emoji = document.getElementById('level1-emoji');
            emoji.style.animation = 'none';
            setTimeout(() => emoji.style.animation = 'bounce 0.5s ease', 10);
        });

        document.getElementById('level1-next-btn').addEventListener('click', () => {
            scores.level1++;
            currentWordIndex++;
            
            if (currentWordIndex < words.length) {
                showWord1();
            } else {
                showFeedback('Flott! 🎃', 2000);
                setTimeout(() => startLevel(2), 2000);
            }
        });

        // Level 2
        function initLevel2() {
            createProgressDots('level2-dots', words.length, currentWordIndex);
            document.getElementById('level2-score').textContent = scores.level2;
            showWord2();
        }

        function showWord2() {
            const word = words[currentWordIndex];
            document.getElementById('level2-emoji').textContent = word.emoji;
            document.getElementById('level2-russian').textContent = word.ru;
            
            level2Answer = [];
            level2SelectedArticle = '';
            level2HintUsed = false;
            
            document.getElementById('level2-answer').innerHTML = '';
            document.querySelectorAll('.article-btn').forEach(btn => btn.classList.remove('selected'));
            
            if (word.article) {
                document.getElementById('level2-article-section').style.display = 'block';
            } else {
                document.getElementById('level2-article-section').style.display = 'none';
            }
            
            createLetterTiles(word.word);
            createProgressDots('level2-dots', words.length, currentWordIndex);
        }

        function createLetterTiles(word) {
            const container = document.getElementById('level2-letters');
            container.innerHTML = '';
            
            const letters = word.split('').sort(() => Math.random() - 0.5);
            letters.forEach((letter, index) => {
                const tile = document.createElement('div');
                tile.className = 'letter-tile';
                tile.textContent = letter;
                tile.dataset.index = index;
                tile.addEventListener('click', () => addLetter(letter, index));
                container.appendChild(tile);
            });
        }

        function addLetter(letter, index) {
            const tile = document.querySelector(`.letter-tile[data-index="${index}"]`);
            if (tile.classList.contains('used')) return;
            
            tile.classList.add('used');
            level2Answer.push({ letter, index });
            
            const answerArea = document.getElementById('level2-answer');
            const answerLetter = document.createElement('div');
            answerLetter.className = 'answer-letter';
            answerLetter.textContent = letter;
            answerLetter.dataset.answerIndex = level2Answer.length - 1;
            answerLetter.addEventListener('click', () => removeLetter(level2Answer.length - 1));
            answerArea.appendChild(answerLetter);
        }

        function removeLetter(answerIndex) {
            const answerLetter = document.querySelector(`.answer-letter[data-answer-index="${answerIndex}"]`);
            if (answerLetter) {
                const tileIndex = level2Answer[answerIndex].index;
                const tile = document.querySelector(`.letter-tile[data-index="${tileIndex}"]`);
                tile.classList.remove('used');
                
                level2Answer.splice(answerIndex, 1);
                document.getElementById('level2-answer').innerHTML = '';
                level2Answer.forEach((item, idx) => {
                    const letter = document.createElement('div');
                    letter.className = 'answer-letter';
                    letter.textContent = item.letter;
                    letter.dataset.answerIndex = idx;
                    letter.addEventListener('click', () => removeLetter(idx));
                    document.getElementById('level2-answer').appendChild(letter);
                });
            }
        }

        document.querySelectorAll('.article-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.article-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                level2SelectedArticle = btn.dataset.article;
            });
        });

        document.getElementById('level2-hint-btn').addEventListener('click', () => {
            const word = words[currentWordIndex].word;
            if (level2Answer.length < word.length) {
                const nextLetter = word[level2Answer.length];
                const tiles = document.querySelectorAll('.letter-tile:not(.used)');
                tiles.forEach(tile => {
                    if (tile.textContent === nextLetter) {
                        tile.style.background = '#6B3FA0';
                        setTimeout(() => tile.style.background = '#FF9418', 1000);
                    }
                });
                level2HintUsed = true;
            }
        });

        document.getElementById('level2-check-btn').addEventListener('click', () => {
            const word = words[currentWordIndex];
            const answer = level2Answer.map(item => item.letter).join('');
            
            let articleCorrect = true;
            if (word.article) {
                articleCorrect = level2SelectedArticle === word.article;
            }
            
            if (answer === word.word && articleCorrect) {
                correctSound();
                createConfetti();
                showFeedback('🎉 Flott!', 1500);
                
                let points = 1;
                if (!level2HintUsed) points++;
                scores.level2 += points;
                document.getElementById('level2-score').textContent = scores.level2;
                
                setTimeout(() => {
                    currentWordIndex++;
                    if (currentWordIndex < words.length) {
                        showWord2();
                    } else {
                        showFeedback('Bra jobba! 🎃', 2000);
                        setTimeout(() => startLevel(3), 2000);
                    }
                }, 1500);
            } else {
                wrongSound();
                showFeedback('Prøv igjen! 👻', 1500);
                const card = document.querySelector('#level2-screen .word-card');
                card.style.animation = 'shake 0.5s ease';
                setTimeout(() => card.style.animation = '', 500);
                
                setTimeout(() => {
                    level2Answer = [];
                    document.getElementById('level2-answer').innerHTML = '';
                    document.querySelectorAll('.letter-tile').forEach(tile => tile.classList.remove('used'));
                }, 1500);
            }
        });

        // Level 3
        function initLevel3() {
            createProgressDots('level3-dots', words.length, currentWordIndex);
            document.getElementById('level3-score').textContent = scores.level3;
            showWord3();
        }

        function showWord3() {
            const word = words[currentWordIndex];
            const choices = document.getElementById('level3-choices');
            choices.innerHTML = '';
            
            const correctIndex = Math.floor(Math.random() * 4);
            const usedEmojis = new Set([word.emoji]);
            
            for (let i = 0; i < 4; i++) {
                const card = document.createElement('div');
                card.className = 'choice-card';
                
                let emoji;
                if (i === correctIndex) {
                    emoji = word.emoji;
                } else {
                    do {
                        const randomWord = words[Math.floor(Math.random() * words.length)];
                        emoji = randomWord.emoji;
                    } while (usedEmojis.has(emoji));
                    usedEmojis.add(emoji);
                }
                
                card.innerHTML = `<div class="choice-emoji">${emoji}</div>`;
                card.dataset.emoji = emoji;
                card.addEventListener('click', () => checkAnswer3(card, emoji, word.emoji));
                choices.appendChild(card);
            }
            
            setTimeout(() => speak(word.nn), 500);
            createProgressDots('level3-dots', words.length, currentWordIndex);
        }

        function checkAnswer3(card, selectedEmoji, correctEmoji) {
            if (selectedEmoji === correctEmoji) {
                card.classList.add('correct');
                correctSound();
                createConfetti();
                showFeedback('⭐ Bra jobba!', 1500);
                scores.level3++;
                document.getElementById('level3-score').textContent = scores.level3;
                
                setTimeout(() => {
                    currentWordIndex++;
                    if (currentWordIndex < words.length) {
                        showWord3();
                    } else {
                        showResults();
                    }
                }, 1500);
            } else {
                card.classList.add('wrong');
                wrongSound();
                showFeedback('Prøv igjen! 👻', 1500);
                setTimeout(() => card.classList.remove('wrong'), 500);
            }
        }

        document.getElementById('level3-speak-btn').addEventListener('click', () => {
            const word = words[currentWordIndex];
            speak(word.nn);
        });

        // Results
        function showResults() {
            totalScore = scores.level1 + scores.level2 + scores.level3;
            localStorage.setItem('bestScore', Math.max(totalScore, parseInt(localStorage.getItem('bestScore') || 0)));
            
            showScreen('results-screen');
            document.getElementById('results-title').textContent = `🎃 GRATULERER, ${playerName.toUpperCase()}!`;
            document.getElementById('results-score').textContent = totalScore;
            
            let badge;
            if (totalScore >= 27) badge = ' Halloween Master!';
            else if (totalScore >= 22) badge = '🎃 Halloween Star!';
            else if (totalScore >= 16) badge = '👻 Great Job!';
            else badge = '🕷️ Keep Learning!';
            
            document.getElementById('results-badge').textContent = badge;
            
            const learnedWords = document.getElementById('learned-words');
            learnedWords.innerHTML = '<h3 style="font-size: 1.5rem; font-weight: 800; margin-bottom: 15px;">Du har lært:</h3>';
            words.forEach(word => {
                const div = document.createElement('div');
                div.className = 'learned-word';
                div.textContent = `${word.emoji} ${word.nn} — ${word.ru}`;
                learnedWords.appendChild(div);
            });
            
            createConfetti();
            victorySound();
        }

        document.getElementById('speak-all-btn').addEventListener('click', () => {
            let delay = 0;
            words.forEach((word, index) => {
                setTimeout(() => speak(word.nn), delay);
                delay += 2000;
            });
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            scores = { level1: 0, level2: 0, level3: 0 };
            currentWordIndex = 0;
            showScreen('level-select-screen');
        });

        // Initialize voices
        if ('speechSynthesis' in window) {
            speechSynthesis.getVoices();
            speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
        }
    </script>
</body>
</html>
