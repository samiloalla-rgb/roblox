<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ROBLOX MEMORY</title>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --roblox-red: #D01012;
            --roblox-blue: #00A2FF;
            --neon-purple: #BF00FF;
            --neon-purple-dark: #8000AA;
            --roblox-dark: #191919;
            --roblox-gray: #393B3D;
            --text-color: #FFFFFF;
            --card-back: #D01012;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Hanken Grotesk', sans-serif;
            background-color: #050505;
            color: var(--text-color);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* Canvas Background */
        #star-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%);
        }

        /* UI Container */
        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* --- MAIN MENU --- */
        #main-menu {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            animation: fadeIn 0.5s ease;
            padding: 20px;
            width: 100%;
            max-width: 800px;
        }

        .main-banner {
            width: 100%;
            max-width: 700px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(191, 0, 255, 0.5);
            border: 3px solid var(--neon-purple);
            margin-bottom: 10px;
        }

        .main-banner img {
            width: 100%;
            height: auto;
            display: block;
        }

        .logo-container {
            margin: 10px 0;
        }

        /* CSS Imitation of Roblox Logo */
        .roblox-logo-text {
            font-size: 3rem;
            font-weight: 900;
            letter-spacing: -2px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-shadow: 2px 2px 0px #000;
        }

        .tilted-o {
            display: inline-block;
            transform: rotate(-15deg);
            border: 3px solid white;
            width: 0.8em;
            height: 0.8em;
            margin: 0 2px;
            position: relative;
        }

        .levels-container {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 10px;
        }

        .level-btn {
            background: linear-gradient(135deg, var(--neon-purple) 0%, var(--neon-purple-dark) 100%);
            border: 2px solid var(--neon-purple);
            color: white;
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            min-width: 140px;
            box-shadow: 0 0 15px rgba(191, 0, 255, 0.6), 0 3px 0 var(--neon-purple-dark);
            font-family: 'Hanken Grotesk', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .level-btn:active {
            transform: translateY(3px);
            box-shadow: 0 0 15px rgba(191, 0, 255, 0.6), 0 0 0 var(--neon-purple-dark);
        }

        .level-btn:hover {
            box-shadow: 0 0 25px rgba(191, 0, 255, 0.9), 0 3px 0 var(--neon-purple-dark);
            filter: brightness(1.2);
        }

        /* --- GAME BOARD --- */
        #game-board {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100%;
            padding: 20px;
        }

        .game-header {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 15px;
            backdrop-filter: blur(5px);
            border: 2px solid var(--neon-purple);
        }

        .home-btn {
            background: linear-gradient(135deg, var(--neon-purple) 0%, var(--neon-purple-dark) 100%);
            border: 2px solid var(--neon-purple);
            color: white;
            width: 45px;
            height: 45px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            box-shadow: 0 0 15px rgba(191, 0, 255, 0.6), 0 3px 0 var(--neon-purple-dark);
            transition: all 0.2s;
        }
        
        .home-btn:active {
            transform: translateY(3px);
            box-shadow: 0 0 15px rgba(191, 0, 255, 0.6), 0 0 0 var(--neon-purple-dark);
        }

        .home-btn:hover {
            box-shadow: 0 0 25px rgba(191, 0, 255, 0.9), 0 3px 0 var(--neon-purple-dark);
            filter: brightness(1.2);
        }

        .score-board {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--neon-purple);
            text-shadow: 0 0 10px rgba(191, 0, 255, 0.5);
        }

        /* Grid */
        .grid {
            display: grid;
            gap: 10px;
            width: 100%;
            max-width: 500px;
            aspect-ratio: 1;
            margin: auto;
        }

        /* Card Styles */
        .card {
            background-color: transparent;
            perspective: 1000px;
            cursor: pointer;
            position: relative;
            width: 100%;
            height: 100%;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card.matched .card-inner {
            transform: rotateY(180deg);
            box-shadow: 0 0 20px var(--neon-purple);
            border: 2px solid var(--neon-purple);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.1);
        }

        .card-back {
            background-color: var(--card-back);
            background-image: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(0,0,0,0.1) 10px, rgba(0,0,0,0.1) 20px);
        }
        
        .card-back img {
            width: 60%;
            height: 60%;
            object-fit: contain;
            opacity: 0.7;
        }

        .card-front {
            background-color: white;
            transform: rotateY(180deg);
            padding: 5px;
        }

        .card-front img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
        }

        /* Free Space for 3x3 level */
        .free-space {
            background: rgba(191, 0, 255, 0.2);
            border: 2px dashed var(--neon-purple);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(191, 0, 255, 0.3);
        }

        .free-space img {
            width: 80%;
            height: 80%;
            object-fit: contain;
        }

        /* Video Modal */
        #video-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 100;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        #video-modal video {
            max-width: 90%;
            max-height: 70vh;
            border-radius: 15px;
            box-shadow: 0 0 40px rgba(191, 0, 255, 0.8);
            border: 3px solid var(--neon-purple);
        }

        #video-continue-btn {
            margin-top: 20px;
            background: linear-gradient(135deg, var(--neon-purple) 0%, var(--neon-purple-dark) 100%);
            border: 2px solid var(--neon-purple);
            color: white;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(191, 0, 255, 0.6);
            font-family: 'Hanken Grotesk', sans-serif;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive */
        @media (max-width: 600px) {
            .roblox-logo-text { font-size: 2.5rem; }
            .level-btn { min-width: 120px; font-size: 0.9rem; padding: 10px 20px; }
            .card-front { font-size: 2rem; }
            .grid { gap: 8px; }
            .main-banner { max-width: 95%; }
        }
    </style>
</head>
<body>

    <canvas id="star-canvas"></canvas>

    <div class="container">
        <!-- MAIN MENU -->
        <div id="main-menu">
            <div class="main-banner">
                <img src="banner_main.png" alt="ROBLOX MEMORY Banner">
            </div>
            
            <div class="logo-container">
                <div class="roblox-logo-text">
                    R<span class="tilted-o"></span>B L<span class="tilted-o"></span>X
                </div>
                <h1 style="margin-top: -10px; font-weight: 700; letter-spacing: 5px;">MEMORY</h1>
            </div>

            <div class="levels-container">
                <button class="level-btn" onclick="startGame(1)">Уровень 1<br>3×3</button>
                <button class="level-btn" onclick="startGame(2)">Уровень 2<br>3×4</button>
                <button class="level-btn" onclick="startGame(3)">Уровень 3<br>4×4</button>
            </div>
        </div>

        <!-- GAME BOARD -->
        <div id="game-board">
            <div class="game-header">
                <button class="home-btn" onclick="goHome()"></button>
                <div class="score-board">Пары: <span id="pairs-count">0</span>/<span id="total-pairs">0</span></div>
            </div>
            <div class="grid" id="grid">
                <!-- Cards generated by JS -->
            </div>
        </div>
    </div>

    <!-- VIDEO MODAL -->
    <div id="video-modal">
        <video id="completion-video" controls>
            <source src="" type="video/mp4">
        </video>
        <button id="video-continue-btn" onclick="closeVideo()">Продолжить</button>
    </div>

    <script>
        // --- AUDIO SYSTEM (Web Audio API) ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
        }

        function playSound(type) {
            if (!audioCtx) initAudio();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'flip') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'match') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
                
                setTimeout(() => {
                    const osc2 = audioCtx.createOscillator();
                    const gain2 = audioCtx.createGain();
                    osc2.connect(gain2);
                    gain2.connect(audioCtx.destination);
                    osc2.type = 'triangle';
                    osc2.frequency.setValueAtTime(659.25, audioCtx.currentTime);
                    gain2.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    gain2.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
                    osc2.start();
                    osc2.stop(audioCtx.currentTime + 0.3);
                }, 100);
            } else if (type === 'error') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.2);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.2);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            }
        }

        // --- GAME LOGIC ---
        // 8 КАРТОЧЕК, КОТОРЫЕ ИСПОЛЬЗУЮТСЯ ВО ВСЕХ УРОВНЯХ
        const allCards = [
            'card_1.png',
            'card_2.png',
            'card_3.png',
            'card_4.png',
            'card_5.png',
            'card_6.png',
            'card_7.png',
            'card_8.png'
        ];

        // УРОВЕНЬ 1: 4 пары (card_1 - card_4)
        // УРОВЕНЬ 2: 6 пар (card_1 - card_6)
        // УРОВЕНЬ 3: 8 пар (card_1 - card_8)
        const cardImages = {
            1: [
                'card_1.png', 'card_1.png',
                'card_2.png', 'card_2.png',
                'card_3.png', 'card_3.png',
                'card_4.png', 'card_4.png'
            ],
            2: [
                'card_1.png', 'card_1.png',
                'card_2.png', 'card_2.png',
                'card_3.png', 'card_3.png',
                'card_4.png', 'card_4.png',
                'card_5.png', 'card_5.png',
                'card_6.png', 'card_6.png'
            ],
            3: [
                'card_1.png', 'card_1.png',
                'card_2.png', 'card_2.png',
                'card_3.png', 'card_3.png',
                'card_4.png', 'card_4.png',
                'card_5.png', 'card_5.png',
                'card_6.png', 'card_6.png',
                'card_7.png', 'card_7.png',
                'card_8.png', 'card_8.png'
            ]
        };

        const completionVideo = 'video_complete.mp4';

        let flippedCards = [];
        let matchedPairs = 0;
        let totalPairs = 0;
        let isLocked = false;
        let currentLevelConfig = {};
        let currentLevel = 1;

        const gridElement = document.getElementById('grid');
        const pairsCountEl = document.getElementById('pairs-count');
        const totalPairsEl = document.getElementById('total-pairs');
        const mainMenu = document.getElementById('main-menu');
        const gameBoard = document.getElementById('game-board');
        const videoModal = document.getElementById('video-modal');
        const completionVideoEl = document.getElementById('completion-video');

        function startGame(level) {
            initAudio();
            currentLevel = level;
            mainMenu.style.display = 'none';
            gameBoard.style.display = 'flex';
            
            if (level === 1) {
                currentLevelConfig = { rows: 3, cols: 3, pairs: 4 };
            } else if (level === 2) {
                currentLevelConfig = { rows: 3, cols: 4, pairs: 6 };
            } else {
                currentLevelConfig = { rows: 4, cols: 4, pairs: 8 };
            }

            totalPairs = currentLevelConfig.pairs;
            matchedPairs = 0;
            flippedCards = [];
            isLocked = false;
            
            pairsCountEl.innerText = '0';
            totalPairsEl.innerText = totalPairs;

            generateGrid();
        }

        function goHome() {
            gameBoard.style.display = 'none';
            mainMenu.style.display = 'flex';
            gridElement.innerHTML = '';
        }

        function generateGrid() {
            gridElement.innerHTML = '';
            gridElement.style.gridTemplateColumns = `repeat(${currentLevelConfig.cols}, 1fr)`;
            gridElement.style.gridTemplateRows = `repeat(${currentLevelConfig.rows}, 1fr)`;

            const levelImages = cardImages[currentLevel];
            let deck = [...levelImages];
            deck.sort(() => 0.5 - Math.random());

            const totalSlots = currentLevelConfig.rows * currentLevelConfig.cols;
            const is3x3 = (currentLevelConfig.rows === 3 && currentLevelConfig.cols === 3);

            for (let i = 0; i < totalSlots; i++) {
                if (is3x3 && i === 4) {
                    const freeSpace = document.createElement('div');
                    freeSpace.className = 'free-space';
                    freeSpace.innerHTML = '<img src="card_house_special.png" alt="House">';
                    gridElement.appendChild(freeSpace);
                    continue;
                }

                const cardValue = deck.pop();
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.value = cardValue;

                card.innerHTML = `
                    <div class="card-inner">
                        <div class="card-front"><img src="${cardValue}" alt="Card"></div>
                        <div class="card-back"><img src="roblox-logo-small.png" onerror="this.style.display='none'" alt="Back"></div>
                    </div>
                `;

                card.addEventListener('click', () => flipCard(card));
                gridElement.appendChild(card);
            }
        }

        function flipCard(card) {
            if (isLocked) return;
            if (card.classList.contains('flipped') || card.classList.contains('matched')) return;

            initAudio();
            playSound('flip');
            card.classList.add('flipped');
            flippedCards.push(card);

            if (flippedCards.length === 2) {
                checkMatch();
            }
        }

        function checkMatch() {
            isLocked = true;
            const [card1, card2] = flippedCards;
            const match = card1.dataset.value === card2.dataset.value;

            if (match) {
                playSound('match');
                setTimeout(() => {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    flippedCards = [];
                    matchedPairs++;
                    pairsCountEl.innerText = matchedPairs;
                    isLocked = false;

                    if (matchedPairs === totalPairs) {
                        setTimeout(() => {
                            showCompletionVideo();
                        }, 500);
                    }
                }, 500);
            } else {
                playSound('error');
                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    flippedCards = [];
                    isLocked = false;
                }, 1000);
            }
        }

        function showCompletionVideo() {
            completionVideoEl.src = completionVideo;
            videoModal.style.display = 'flex';
            completionVideoEl.play();
        }

        function closeVideo() {
            completionVideoEl.pause();
            videoModal.style.display = 'none';
            goHome();
        }

        // --- INTERACTIVE STARS BACKGROUND ---
        const canvas = document.getElementById('star-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let stars = [];
        let mouse = { x: -1000, y: -1000 };

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        class Star {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 2;
                this.baseOpacity = Math.random() * 0.5 + 0.1;
                this.opacity = this.baseOpacity;
                this.twinkleSpeed = Math.random() * 0.02 + 0.005;
                this.angle = Math.random() * Math.PI * 2;
            }

            update() {
                this.angle += this.twinkleSpeed;
                this.opacity = this.baseOpacity + Math.sin(this.angle) * 0.2;

                const dx = mouse.x - this.x;
                const dy = mouse.y - this.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                const maxDist = 150;

                if (distance < maxDist) {
                    const force = (maxDist - distance) / maxDist;
                    this.opacity += force * 0.5;
                    this.x -= (dx / distance) * force * 0.5;
                    this.y -= (dy / distance) * force * 0.5;
                }
            }

            draw() {
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initStars() {
            resize();
            for (let i = 0; i < 150; i++) {
                stars.push(new Star());
            }
            animateStars();
        }

        function animateStars() {
            ctx.clearRect(0, 0, width, height);
            stars.forEach(star => {
                star.update();
                star.draw();
            });
            requestAnimationFrame(animateStars);
        }

        window.addEventListener('resize', resize);
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });
        
        window.addEventListener('touchmove', (e) => {
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
        });

        initStars();
    </script>
</body>
</html>
